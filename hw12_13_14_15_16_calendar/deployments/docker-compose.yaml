services:
  postgres:
    image: postgres:15-alpine
    container_name: calendar_postgres
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U calendar" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calendar_network

  kafka:
    image: apache/kafka:3.7.0
    container_name: calendar_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - calendar_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: calendar_kafka_ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: calendar-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - calendar_network

  calendar:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: calendar_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      - DATABASE_DSN=postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
    networks:
      - calendar_network
    restart: unless-stopped

  calendar_scheduler:
    build:
      context: ..
      dockerfile: build/Dockerfile.scheduler
    container_name: calendar_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - DATABASE_DSN=postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    networks:
      - calendar_network
    restart: unless-stopped

  calendar_storer:
    build:
      context: ..
      dockerfile: build/Dockerfile.storer
    container_name: calendar_storer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - DATABASE_DSN=postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    networks:
      - calendar_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: calendar_prometheus
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - calendar
    networks:
      - calendar_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: calendar_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - calendar_network
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:


networks:
  calendar_network:
    driver: bridge
