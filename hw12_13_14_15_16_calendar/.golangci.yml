version: "2"

run:
  tests: true
  timeout: 5m

linters-settings:
  funlen:
    lines: 150
    statements: 80
  gocognit:
    min-complexity: 40
  goconst:
    min-len: 2
    min-occurrences: 3
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - commentedOutCode
      - todoCommentWithoutDetail
      - paramTypeCombine
      - hugeParam
  revive:
    rules:
      - name: unused-parameter
        disabled: true
  depguard:
    rules:
      main:
        deny:
          - pkg: "github.com/sirupsen/logrus"
            desc: "use standard logger or zap"

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocritic
    - whitespace

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocritic
    - linters:
        - gosec
      text: "G112:"
    - linters:
        - gocritic
      text: "exitAfterDefer"
